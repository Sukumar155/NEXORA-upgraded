<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nexora-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Disaster Intelligence &amp; Emergency Response</title>
    <meta
      name="description"
      content="NEXORA unifies flood monitoring, emergency dispatch, shelters and citizen SOS into one operational platform for district response teams."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1A3A6B" />

    <!-- Typeface: Inter (product UI) + JetBrains Mono (telemetry) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;640;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!--
      Theme bootstrap. This has to run BEFORE the first paint, inline and
      ahead of the React bundle, because App.tsx only applies the theme in a
      useEffect — that is after mount, so without this the page renders one
      frame of the light theme. On a dark-mode reload that flash is what made
      the whole page look like it had reverted to black-on-white.

      Kept in sync with the store, which persists the choice under
      `nexora_theme` and defaults to 'light'.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexora_theme') || 'light';
          var dark = stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* Private mode / storage disabled — fall through to light. */
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8F8F7] dark:bg-[#0F0F0F] text-[#14151A] dark:text-[#FFFFFF] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
